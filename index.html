<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }

        /* 화면을 왼쪽과 오른쪽으로 2분할하는 컨테이너 */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 왼쪽: 검색창 및 결과 리스트 영역 */
        .sidebar {
            width: 350px;
            height: 100%;
            background-color: #f7f7f7;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            z-index: 10;
        }

        /* 검색 박스 스타일 */
        .search-box {
            padding: 15px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .search-form {
            display: flex;
            gap: 5px;
        }

        .search-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .search-button {
            padding: 10px 15px;
            background-color: #fee500; /* 카카오 시그니처 노란색 */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .search-button:hover {
            background-color: #fada0a;
        }

        /* 검색 결과 리스트 영역 (스크롤 가능) */
        .places-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .place-item {
            padding: 15px;
            background-color: #fff;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            cursor: pointer;
        }

        .place-item:hover {
            background-color: #f0f0f0;
        }

        .place-title {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }

        .place-address {
            font-size: 13px;
            color: #666;
        }

        /* 오른쪽: 지도 영역 */
        .map-container {
            flex: 1;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <form class="search-form" onsubmit="searchPlaces(); return false;">
                    <input type="text" id="keyword" class="search-input" placeholder="장소를 검색해보세요" value="강남역">
                    <button type="submit" class="search-button">검색</button>
                </form>
            </div>
            <div id="placesList" class="places-list"></div>
        </div>

        <div id="map" class="map-container"></div>
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=[선생님 JS 키]&libraries=services"></script>
    
    <script>
        // 전역 변수 선언 (여러 함수에서 함께 사용하기 위함)
        let map; 
        let placeSearchService; 
        let currentMarkers = []; // 지도에 표시된 마커들을 저장할 배열

        // 페이지가 완전히 로드된 후(HTML, 카카오 스크립트 포함) 실행되도록 설정
        window.addEventListener('DOMContentLoaded', function() {
            // 카카오 지도 API가 정상적으로 로드되었는지 확인 후 초기화 시작
            if (typeof kakao !== 'undefined' && kakao.maps) {
                initMap();
            } else {
                alert("카카오 지도 라이브러리를 로드하지 못했습니다. API 키를 확인해주세요.");
            }
        });

        // 지도를 초기화하고 현재 위치를 잡는 함수
        function initMap() {
            const mapContainer = document.getElementById('map'); // 지도를 표시할 div
            
            // 기본 중심 좌표 (위치 권한 거부 시 사용할 서울 시청 좌표)
            const defaultPosition = new kakao.maps.LatLng(37.566826, 126.9786567); 
            
            const mapOptions = {
                center: defaultPosition, // 지도의 중심좌표
                level: 5 // 지도의 확대 레벨 (요청하신 level 5)
            };

            // 지도 생성
            map = new kakao.maps.Map(mapContainer, mapOptions);
            
            // 장소 검색 서비스 객체 생성
            placeSearchService = new kakao.maps.services.Places();

            // HTML5의 Geolocation(위치 정보)을 사용할 수 있는지 확인
            if (navigator.geolocation) {
                // 사용자의 현재 위치를 요청
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude; // 위도
                    const lon = position.coords.longitude; // 경도
                    
                    const currentPosition = new kakao.maps.LatLng(lat, lon);
                    
                    // 지도의 중심을 현재 위치로 이동
                    map.setCenter(currentPosition);
                    
                    // 현재 위치에 마커 표시
                    displayCurrentLocationMarker(currentPosition);
                    
                }, function(error) {
                    // 위치 권한을 거부하거나 오류가 발생했을 때 처리
                    console.error("위치 권한 획득 실패:", error);
                    alert("위치 권한을 허용하지 않아 기본 위치(서울시청)로 지도를 표시합니다.");
                });
            } else {
                alert("이 브라우저에서는 위치 서비스(Geolocation)를 지원하지 않습니다.");
            }
        }

        // 현재 위치에 특별한 마커를 표시하는 함수
        function displayCurrentLocationMarker(position) {
            const marker = new kakao.maps.Marker({
                map: map,
                position: position
            });
            
            // 인포윈도우로 '현재 위치'라고 표시
            const infowindow = new kakao.maps.InfoWindow({
                content: '<div style="padding:5px;font-size:12px;text-align:center;">내 현재 위치</div>'
            });
            infowindow.open(map, marker);
        }

        // 장소 검색을 수행하는 함수
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;

            if (!keyword.replace(/^\s+|\s+$/g, '')) {
                alert('키word를 입력해주세요!');
                return false;
            }

            // 카카오 장소 검색 서비스를 통해 키워드로 장소 검색 요청
            placeSearchService.keywordSearch(keyword, placesSearchCB);
        }

        // 장소검색이 완료됐을 때 호출되는 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                // 정상적으로 검색이 완료됐으면 검색 목록과 마커를 표출
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 결과 중 오류가 발생했습니다.');
            }
        }

        // 검색 결과 목록과 마ker를 표출하는 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            
            // 기존에 생성되어 있던 마커들과 검색 결과 목록 초기화
            removeMarkers();
            listEl.innerHTML = '';

            // 지도를 재조정하기 위한 중심 범위 객체 생성
            const bounds = new kakao.maps.LatLngBounds();

            // 검색된 장소 수만큼 반복
            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                
                // 마커 생성 및 지도 표시
                const marker = addMarker(placePosition);
                
                // 검색 결과 HTML 아이템 생성
                const itemEl = document.createElement('div');
                itemEl.className = 'place-item';
                itemEl.innerHTML = `
                    <div class="place-title">${places[i].place_name}</div>
                    <div class="place-address">${places[i].road_address_name ? places[i].road_address_name : places[i].address_name}</div>
                `;

                // 검색 결과를 클릭했을 때 해당 위치로 지도 이동하는 이벤트 추가
                itemEl.onclick = function() {
                    map.setCenter(placePosition);
                    map.setLevel(4); // 클릭 시 조금 더 확대해서 보기 리벨 조절
                };

                listEl.appendChild(itemEl);

                // 검색된 장소들의 위치를 기준으로 지도 범위를 넓히기 위해 좌표 추가
                bounds.extend(placePosition);
            }

            // 검색 결과 위치들을 모두 포함할 수 있도록 지도 중심과 레벨 변경
            map.setBounds(bounds);
        }

        // 마커를 생성하고 지도 위에 표시하는 함수
        function addMarker(position) {
            const marker = new kakao.maps.Marker({
                position: position,
                map: map
            });
            
            currentMarkers.push(marker); // 추후 삭제를 위해 배열에 저장
            return marker;
        }

        // 지도 위에 표시되고 있는 마커를 모두 제거하는 함수
        function removeMarkers() {
            for (let i = 0; i < currentMarkers.length; i++) {
                currentMarkers[i].setMap(null);
            }
            currentMarkers = [];
        }
    </script>
</body>
</html>
