<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Kakao Map Service</title>
    <style>
        /* 기본 스타일 및 화면 2분할 레이아웃 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        
        .main-container { display: flex; width: 100%; height: 100vh; }

        /* 왼쪽 사이드바 (검색 및 리스트) */
        #side-bar {
            width: 350px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
            border-right: 1px solid #ddd;
            z-index: 10;
        }

        .search-box { padding: 20px; background: #fff; border-bottom: 1px solid #eee; }
        .search-box input { width: 70%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .search-box button { width: 25%; padding: 8px; background: #fee500; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        #results-list { flex: 1; overflow-y: auto; list-style: none; }
        #results-list li { padding: 15px; border-bottom: 1px solid #eee; background: #fff; cursor: pointer; }
        #results-list li:hover { background: #f1f1f1; }
        .place-title { font-weight: bold; display: block; color: #333; }
        .place-address { font-size: 12px; color: #666; margin-top: 4px; display: block; }

        /* 오른쪽 지도 영역 */
        #map-display { flex: 1; height: 100%; }
    </style>
</head>
<body>

<div class="main-container">
    <div id="side-bar">
        <div class="search-box">
            <form onsubmit="searchPlacesByKeyword(); return false;">
                <input type="text" id="keyword-input" placeholder="장소 입력...">
                <button type="submit">검색</button>
            </form>
        </div>
        <ul id="results-list"></ul>
    </div>

    <div id="map-display"></div>
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d6161b499d7ebcb40a09bb45b6b3d55c&libraries=services&autoload=false"></script>

<script>
    let map; // 지도 객체
    let placeService; // 장소 검색 서비스 객체
    let markers = []; // 마커를 관리할 배열

    // 1. SDK 로드 후 실행 (로딩 오류 방지)
    kakao.maps.load(function() {
        const container = document.getElementById('map-display');
        const options = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 좌표 (서울시청)
            level: 5 // 확대 레벨
        };

        map = new kakao.maps.Map(container, options);
        placeService = new kakao.maps.services.Places();

        // 2. 현재 위치 가져오기 시도
        requestCurrentPosition();
    });

    // 사용자의 현재 위치를 받아 지도 중심을 이동하는 함수
    function requestCurrentPosition() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const currentLatLng = new kakao.maps.LatLng(lat, lon);

                map.setCenter(currentLatLng); // 지도 중심 이동
                
                // 현재 위치 마커 표시
                new kakao.maps.Marker({
                    position: currentLatLng,
                    map: map
                });
            }, function(error) {
                console.log("위치 정보를 가져올 수 없습니다.");
            });
        }
    }

    // 키워드 검색 실행 함수
    function searchPlacesByKeyword() {
        const keyword = document.getElementById('keyword-input').value;

        if (!keyword.replace(/^\s+|\s+$/g, '')) {
            alert('검색어를 입력해주세요!');
            return false;
        }

        // 장소 검색 요청
        placeService.keywordSearch(keyword, searchCallback);
    }

    // 장소 검색 결과 처리 콜백 (에러 핸들링 포함)
    function searchCallback(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            displaySearchResults(data);
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('검색 결과가 존재하지 않습니다.');
        } else if (status === kakao.maps.services.Status.ERROR) {
            alert('검색 결과 중 오류가 발생했습니다.');
        }
    }

    // 검색 결과를 화면과 지도에 표시하는 함수
    function displaySearchResults(places) {
        const listElement = document.getElementById('results-list');
        const bounds = new kakao.maps.LatLngBounds(); // 지도 범위 조절 객체
        
        // 기존 검색 결과 및 마커 초기화
        listElement.innerHTML = '';
        removeExistingMarkers();

        for (let i = 0; i < places.length; i++) {
            const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
            const marker = createMarker(placePosition);
            const itemElement = createListItem(places[i]);

            // 리스트 클릭 시 해당 장소로 부드럽게 이동
            itemElement.onclick = function() {
                map.panTo(placePosition);
            };

            listElement.appendChild(itemElement);
            bounds.extend(placePosition); // 범위를 넓힘
        }

        // 모든 검색 결과가 보이도록 지도 범위 자동 조절
        map.setBounds(bounds);
    }

    // 마커 생성 및 배열 관리 함수
    function createMarker(position) {
        const marker = new kakao.maps.Marker({
            position: position,
            map: map
        });
        markers.push(marker);
        return marker;
    }

    // 기존 마커 전체 삭제 함수
    function removeExistingMarkers() {
        for (let i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }
        markers = [];
    }

    // 리스트 아이템 HTML 생성 함수
    function createListItem(place) {
        const li = document.createElement('li');
        li.innerHTML = `
            <span class="place-title">${place.place_name}</span>
            <span class="place-address">${place.road_address_name || place.address_name}</span>
        `;
        return li;
    }
</script>

</body>
</html>
