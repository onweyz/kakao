<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 검색 서비스</title>
    <style>
        /* 전체 레이아웃 설정 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; }

        .container { display: flex; width: 100%; height: 100vh; }

        /* 왼쪽 사이드바: 검색창 및 결과 리스트 */
        #side_bar {
            width: 350px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 2;
        }

        .search_section { padding: 20px; border-bottom: 1px solid #eee; }
        .search_section input { 
            width: 70%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; 
        }
        .search_section button { 
            width: 25%; padding: 10px; background: #fee500; border: none; 
            border-radius: 4px; cursor: pointer; font-weight: bold; 
        }

        #results_list { flex: 1; overflow-y: auto; list-style: none; }
        #results_list li { 
            padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; 
        }
        #results_list li:hover { background-color: #f9f9f9; }
        #results_list .place_name { font-weight: bold; color: #333; display: block; }
        #results_list .address { font-size: 0.85rem; color: #666; margin-top: 5px; }

        /* 오른쪽 지도 영역 */
        #map_canvas { flex: 1; height: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div id="side_bar">
        <div class="search_section">
            <form onsubmit="executeSearch(); return false;">
                <input type="text" id="search_keyword" placeholder="장소 검색 (예: 강남역)">
                <button type="submit">검색</button>
            </form>
        </div>
        <ul id="results_list">
            </ul>
    </div>
    <div id="map_canvas"></div>
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d6161b499d7ebcb40a09bb45b6b3d55c&libraries=services&autoload=false"></script>

<script>
    let mapObject;
    let placeSearchService;
    let currentMarkers = [];

    // 1. SDK가 완전히 로드된 후 실행되도록 보장
    kakao.maps.load(function() {
        const container = document.getElementById('map_canvas');
        const options = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 좌표
            level: 5 // 확대 레벨
        };

        mapObject = new kakao.maps.Map(container, options);
        placeSearchService = new kakao.maps.services.Places();

        // 2. 페이지 로드 시 현재 위치 요청
        requestUserLocation();
    });

    // 위치 권한 요청 및 지도 중심 이동
    function requestUserLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const userLatLng = new kakao.maps.LatLng(lat, lng);
                
                mapObject.setCenter(userLatLng);
                
                // 현재 위치 표시용 마커
                new kakao.maps.Marker({
                    position: userLatLng,
                    map: mapObject
                });
            }, function(error) {
                console.warn("위치 정보를 가져올 수 없습니다.");
            });
        }
    }

    // 검색 실행 함수
    function executeSearch() {
        const keyword = document.getElementById('search_keyword').value;

        if (!keyword.trim()) {
            alert("검색어를 입력해주세요.");
            return;
        }

        // 키워드로 장소 검색 요청
        placeSearchService.keywordSearch(keyword, searchCallback);
    }

    // 장소 검색 결과 처리 콜백
    function searchCallback(data, status) {
        if (status === kakao.maps.services.Status.OK) {
            renderSearchResults(data);
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert("검색 결과가 없습니다.");
        } else {
            alert("검색 중 오류가 발생했습니다.");
        }
    }

    // 검색 결과를 화면과 지도에 표시
    function renderSearchResults(places) {
        const listContainer = document.getElementById('results_list');
        const bounds = new kakao.maps.LatLngBounds(); // 지도 범위 자동 조절용 객체
        
        clearExistingMarkers(); // 기존 마커 삭제
        listContainer.innerHTML = ''; // 기존 리스트 삭제

        for (let i = 0; i < places.length; i++) {
            const position = new kakao.maps.LatLng(places[i].y, places[i].x);
            
            // 지도에 마커 추가
            const marker = new kakao.maps.Marker({
                position: position,
                map: mapObject
            });
            currentMarkers.push(marker);

            // 사이드바 리스트 아이템 추가
            const listItem = document.createElement('li');
            listItem.innerHTML = `
                <span class="place_name">${places[i].place_name}</span>
                <span class="address">${places[i].road_address_name || places[i].address_name}</span>
            `;
            
            // 리스트 클릭 시 해당 위치로 지도 이동
            listItem.onclick = function() {
                mapObject.panTo(position);
            };

            listContainer.appendChild(listItem);

            // LatLngBounds에 현재 좌표 추가
            bounds.extend(position);
        }

        // 검색된 모든 장소가 보이도록 지도 범위 재설정
        mapObject.setBounds(bounds);
    }

    // 마커 제거 함수
    function clearExistingMarkers() {
        for (let i = 0; i < currentMarkers.length; i++) {
            currentMarkers[i].setMap(null);
        }
        currentMarkers = [];
    }
</script>

</body>
</html>
